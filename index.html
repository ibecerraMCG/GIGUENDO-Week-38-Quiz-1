<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 38 Quiz 1</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }[data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }[data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }[data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }[data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 38 Quiz 1</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData =[
            // --- Section 1: Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera ---
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO1: Identify the jejunum, ileum, appendix, and large intestine (cecum, ascending colon, transverse colon, descending colon, and sigmoid colon), rectum, and anus. Describe their location, gross structure (including parts, internal features, and associated mesenteries), distinguishing characteristics, neurovascular supply, relationships to other structures, and basic functions.",
                question: "A 45-year-old male undergoes an exploratory laparotomy for a suspected bowel obstruction. During the procedure, the surgeon inspects the small intestine and notes a segment located in the right lower quadrant. This segment has a thick, fatty mesentery making the vasculature difficult to see, and the arterial supply consists of numerous short arcades and short vasa recta. Palpation reveals a sparse presence of mucosal folds. Which of the following best identifies this segment of the intestine?",
                options: {
                    A: "Ascending colon",
                    B: "Descending duodenum",
                    C: "Ileum",
                    D: "Jejunum",
                    E: "Transverse colon"
                },
                correctAnswer: "C",
                rationale: "The ileum is the third portion of the small intestine, located in the right lower quadrant. It is distinguished from the jejunum by having numerous short arcades, short vasa recta, a thicker, fatty mesentery that obscures the vasculature, and a sparse presence of plicae circulares (mucosal folds).",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 3: \"Distinguishing characteristics: a. Numerous short arcades and short vasa recta b. Thicker, fatty mesentery making vasculature less visible c. Sparse presence of plicae circulares (absent in distal ileum)\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO1: Identify the jejunum, ileum, appendix, and large intestine (cecum, ascending colon, transverse colon, descending colon, and sigmoid colon), rectum, and anus. Describe their location, gross structure (including parts, internal features, and associated mesenteries), distinguishing characteristics, neurovascular supply, relationships to other structures, and basic functions.",
                question: "A 56-year-old woman undergoes a screening colonoscopy. As the gastroenterologist advances the endoscope through the large intestine, characteristic sacculations or pouches are observed along the length of the colon. These pouches give the colon its typical segmented appearance. Which of the following anatomic features is primarily responsible for the formation of these sacculations?",
                options: {
                    A: "Dense packing of plicae circulares",
                    B: "Invagination of omental (epiploic) appendages",
                    C: "Peristaltic contractions of the internal anal sphincter",
                    D: "Teniae coli being shorter than the large intestine",
                    E: "Thickening of the circular smooth muscle layer"
                },
                correctAnswer: "D",
                rationale: "The characteristic sacculations of the large intestine are called haustra. They form because the three thickened bands of longitudinal smooth muscle, the teniae coli, are shorter than the large intestine itself, causing the wall of the colon to bunch up.",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 4: \"Haustra – sacculations or pouches of the colon between the teniae coli a. Form because teniae coli are shorter than large intestine, causing the large intestine to bunch up with the contraction of the teniae coli\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO2: Identify and describe the superior and inferior mesenteric arteries, major branches, and the structures that they supply noting major anastomoses. Describe and trace the venous drainage patterns of the small and large intestines, rectum, and anus.",
                question: "A 72-year-old male with severe atherosclerotic disease is found to have complete occlusion of the inferior mesenteric artery (IMA) at its origin. Despite this, his descending colon remains viable and does not undergo ischemic necrosis. Collateral blood flow to the descending colon is most likely maintained by an anastomosis connecting the middle colic artery to the left colic artery. What is the name of this anastomotic vessel?",
                options: {
                    A: "Appendicular artery",
                    B: "Gastroduodenal artery",
                    C: "Ileocolic artery",
                    D: "Marginal artery (of Drummond)",
                    E: "Superior rectal artery"
                },
                correctAnswer: "D",
                rationale: "The marginal artery (of Drummond) provides a crucial collateral circulation pathway by connecting the middle colic artery (a branch of the superior mesenteric artery) to the left colic artery (a branch of the inferior mesenteric artery).",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 7: \"Marginal artery (of Drummond) – connect middle colic a. (SMA) to left colic a. (IMA) for collateral circulation\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO2: Identify and describe the superior and inferior mesenteric arteries, major branches, and the structures that they supply noting major anastomoses. Describe and trace the venous drainage patterns of the small and large intestines, rectum, and anus.",
                question: "A 60-year-old male with a history of cirrhosis presents with ascites and signs of portal hypertension. The elevated pressure in his portal venous system causes backflow and engorgement of the veins draining his gastrointestinal tract. Which of the following veins directly drains the descending colon, sigmoid colon, and superior portion of the rectum before joining the splenic vein?",
                options: {
                    A: "Hepatic portal vein",
                    B: "Inferior mesenteric vein",
                    C: "Internal pudendal vein",
                    D: "Left gastric vein",
                    E: "Superior mesenteric vein"
                },
                correctAnswer: "B",
                rationale: "The inferior mesenteric vein lies to the left of the SMA and drains the descending colon, sigmoid colon, and the superior portion of the rectum. It typically joins with the splenic vein, which then joins the superior mesenteric vein to form the portal vein.",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 7: \"Inferior Mesenteric Vein... Drains: descending colon, sigmoid colon, and superior portion of rectum... Joins with splenic vein and later the superior mesenteric vein to form portal vein\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO3: Discuss the sympathetic and parasympathetic innervation of gut structures.",
                question: "A 50-year-old woman undergoes resection of a benign tumor located in the descending colon. The surgeon must be careful to preserve the autonomic nerve supply to the remaining hindgut to ensure proper peristalsis and function. Presynaptic parasympathetic fibers supplying the large intestine distal to the left colic flexure originate from which of the following locations?",
                options: {
                    A: "Anterior vagal trunk",
                    B: "Celiac ganglion",
                    C: "Intermediolateral cell column (IML) at T8-L2",
                    D: "S2-S4 spinal cord levels",
                    E: "Superior mesenteric ganglion"
                },
                correctAnswer: "D",
                rationale: "Parasympathetic innervation to the gut changes at the left colic flexure. Proximal to the flexure, presynaptic fibers come from the Vagus nerve (CN X). Distal to the left colic flexure, presynaptic parasympathetic fibers originate from the S2-S4 spinal cord levels and follow the pelvic splanchnic nerves.",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 8: \"Distal to the left colic flexure a. Presynaptic fibers originate from the S2-S4 spinal cord levels. b. Presynaptic fibers follow pelvic splanchnic nerves to their target organ\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO3: Discuss the sympathetic and parasympathetic innervation of gut structures.",
                question: "A 35-year-old man is suddenly frightened by a loud noise, triggering a systemic \"fight or flight\" response. This results in decreased intestinal peristalsis and profound vasoconstriction of the mesenteric vessels. The presynaptic sympathetic fibers responsible for initiating this response in the gut originate from which of the following structures?",
                options: {
                    A: "Intermediolateral cell column (IML) at T8-L2(3)",
                    B: "Myenteric (Auerbach's) plexus",
                    C: "Parasympathetic ganglia of the vagus nerve",
                    D: "S2-S4 spinal cord segments",
                    E: "Superior mesenteric ganglion"
                },
                correctAnswer: "A",
                rationale: "Sympathetic innervation to the gut mediates the \"fight or flight\" response, causing vasoconstriction and inhibiting peristalsis. The presynaptic fibers for this pathway originate in the intermediolateral cell column (IML) of the spinal cord at the T8-L2(3) levels.",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 8: \"Sympathetic Innervation 1. Presynaptic fibers originate in the IML at the T8-L2(3) levels... Function: “fight or flight” a. Vasoconstriction b. Inhibits peristalsis\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO4: Identify locations of referred pain for major midgut and hindgut structures and discuss how pain is referred when areas of the peritoneum are irritated. Explain how pain from an inflamed appendix is referred.",
                question: "A 22-year-old man comes to the emergency department complaining of a vague, dull ache around his umbilicus that started 4 hours ago. He is diagnosed with early acute appendicitis. Which of the following best explains why the pain is initially perceived in the periumbilical region?",
                options: {
                    A: "Afferent pain fibers enter the spinal cord at the T10 level",
                    B: "Inflammatory exudate pools around the umbilicus",
                    C: "Irritation of the parietal peritoneum in the right lower quadrant",
                    D: "Somatic sensory fibers from the vagus nerve refer pain to the midline",
                    E: "The appendix physically rests against the umbilicus"
                },
                correctAnswer: "A",
                rationale: "In early appendicitis, the visceral pain is referred to the T10 dermatome (the periumbilical region) because the visceral afferent pain fibers accompanying sympathetic nerves from the appendix enter the spinal cord at the T10 level. The brain misinterprets this visceral pain as somatic pain coming from that dermatome.",
                source: "[Superior and Inferior Mesenteric Arteries and Associated Viscera PDF], Page 5: \"The pain of appendicitis usually commences as a vague pain in the peri-umbilical region because afferent pain fibers enter the spinal cord at the T10 level.\""
            },
            {
                section: "Superior and Inferior Mesenteric Arteries and Associated Abdominal Viscera",
                fullLO: "LO4: Identify locations of referred pain for major midgut and hindgut structures and discuss how pain is referred when areas of the peritoneum are irritated. Explain how pain from an inflamed appendix is referred.",
                question: "A 24-year-old woman is admitted for suspected appendicitis. Her pain initially started around her belly button but has now localized as a severe, sharp pain in her right lower quadrant. Digital pressure over McBurney’s point produces maximum tenderness. This shift and change in the quality of the pain is most directly the result of irritation of which of the following structures?",
                options: {
                    A: "Ileocecal valve",
                    B: "Parietal peritoneum lining the abdominal wall",
                    C: "Pelvic splanchnic nerves",
                    D: "Visceral peritoneum covering the appendix",
                    E: "White communicating rami of T10"

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Superior and Inferior Mesenteric")) btnText = "Mesenteric Arteries & Viscera";
                    if (btnText.includes("Development of the Pharyngeal Arches")) btnText = "Pharyngeal Arches Development";
                    if (btnText.includes("Development of the Gastrointestinal System")) btnText = "GI System Development";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
